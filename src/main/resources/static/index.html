<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSA Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>DSA Tracker</h1>
    <div class="top-right">
      <p id="plan-line">Loading…</p>
      <span class="who" id="who"></span>
      <button type="button" class="btn ghost" id="open-settings">Settings</button>
      <button type="button" class="btn ghost" id="sign-out">Sign out</button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <!-- Four headline numbers in one quiet row -->
  <!-- Four headline numbers. None of them can drop to zero because of a missed day. -->
  <section class="stats" aria-label="Summary">
    <div class="stat">
      <div class="stat-label">Long-term memory</div>
      <div class="stat-value" id="longterm-count">–</div>
      <div class="stat-sub">problems you'd remember for 3+ weeks</div>
    </div>
    <div class="stat">
      <div class="stat-label">Due today</div>
      <div class="stat-value" id="due-count">–</div>
      <div class="stat-sub" id="due-sub"></div>
    </div>
    <div class="stat">
      <div class="stat-label">Done</div>
      <div class="stat-value"><span id="solved-count">–</span><span class="unit" id="solved-target"></span></div>
      <div class="bar" aria-hidden="true"><div class="bar-fill" id="solved-bar"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Study days</div>
      <div class="stat-value" id="study-days">–</div>
      <div class="stat-sub" id="week-sub"></div>
    </div>
  </section>

  <div class="layout">
    <main class="main">
      <section class="section" aria-labelledby="today-h">
        <div class="section-head">
          <h2 id="today-h">Today</h2>
          <span class="section-note" id="today-note"></span>
        </div>
        <ul class="due-list" id="due-list"></ul>
      </section>

      <section class="section" aria-labelledby="tests-h">
        <div class="section-head">
          <h2 id="tests-h">Weekly tests</h2>
          <span class="section-note">New problems, same patterns as your week</span>
        </div>
        <ul class="test-list" id="test-list"></ul>
      </section>

      <section class="section" aria-labelledby="nc-h">
        <div class="section-head">
          <h2 id="nc-h">NeetCode 150</h2>
          <span class="section-note" id="catalog-summary"></span>
        </div>
        <div class="toolbar">
          <div class="seg" role="radiogroup" aria-label="Show">
            <label><input type="radio" name="show" value="all" checked><span>All</span></label>
            <label><input type="radio" name="show" value="todo"><span>To do</span></label>
            <label><input type="radio" name="show" value="done"><span>Done</span></label>
          </div>
          <input type="search" id="catalog-search" placeholder="Search" aria-label="Search problems">
        </div>
        <div id="catalog"></div>
      </section>
    </main>

    <aside class="aside">
      <section class="section heat" aria-labelledby="heat-h">
        <div class="section-head">
          <h2 id="heat-h">Study calendar</h2>
          <span class="section-note" id="calendar-note"></span>
        </div>
        <div class="heatmap-scroll">
          <div class="heatmap" id="heatmap" role="grid" aria-label="Activity per day"></div>
        </div>
        <div class="legend" aria-hidden="true">
          <span>Less</span>
          <i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i><i class="cell l4"></i>
          <span>More</span>
        </div>
        <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
      </section>

      <section class="section" aria-labelledby="mem-h">
        <div class="section-head">
          <h2 id="mem-h">Memory</h2>
          <span class="section-note" id="mem-total"></span>
        </div>
        <div class="stages" id="stages" role="img" aria-label="Problems by memory stage"></div>
        <ul class="stage-legend" id="stage-legend"></ul>
        <p class="recall" id="recall"></p>
      </section>
    </aside>
  </div>
</div>

<dialog id="done-dialog" aria-labelledby="done-title">
  <form method="dialog" id="done-form" novalidate>
    <div>
      <h2 id="done-title">Mark as done</h2>
      <p class="dialog-meta" id="done-meta"></p>
    </div>
    <label class="field">
      <span>What did you learn?</span>
      <textarea name="learnings" rows="5" maxlength="2000" required
                placeholder="The pattern, the trick you missed, an edge case to remember"></textarea>
    </label>
    <label class="field">
      <span>Excalidraw link <em>optional</em></span>
      <input name="excalidrawUrl" type="url" maxlength="500" pattern="https://.*"
             placeholder="https://excalidraw.com/#json=…">
    </label>
    <p class="form-error" id="done-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="done-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="done-save">Mark done</button>
    </div>
  </form>
</dialog>

<dialog id="settings-dialog" aria-labelledby="settings-title">
  <form method="dialog" id="settings-form" novalidate>
    <div>
      <h2 id="settings-title">Settings</h2>
      <p class="dialog-meta" id="settings-meta"></p>
    </div>
    <label class="field">
      <span>Start date</span>
      <input name="startDate" type="date" required>
      <small class="hint">Day 1 of your 100-day plan. Days before it never count as absent.</small>
    </label>
    <p class="form-error" id="settings-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="settings-cancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js" type="module"></script>
</body>
</html>
