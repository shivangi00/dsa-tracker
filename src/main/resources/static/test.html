<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly test · DSA Tracker</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap test-wrap">
  <header class="top">
    <a href="/" class="back-link">← Dashboard</a>
    <button type="button" class="btn ghost theme-toggle" data-theme-toggle></button>
  </header>

  <h1 class="test-h1" id="title">Weekly test</h1>
  <p class="test-intro" id="dates"></p>
  <ol class="test-steps">
    <li>Read the problem and pick the pattern you'd use. Don't look at hints or the solution first.</li>
    <li>Solve it on LeetCode, then say how it went. No timer and no deadline.</li>
  </ol>

  <div id="summary" class="test-summary" hidden></div>
  <div id="questions"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<script src="test.js" type="module"></script>
</body>
</html>
